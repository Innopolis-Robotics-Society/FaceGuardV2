verbose = "info"
hidden = true
include_verbatim = true

exclude = [
  #tg links can break the logic
  'https://t\.me/.*',

  # local adresses that are not reachable from GitHub
  '.*localhost.*',
  '.*127\.0\.0\.1.*',
   
  # inner ML-service, not accessible during the check from lychee
  'http://ml:8001/.*'
]

exclude_path = [
  # ignore files with the extension .html
  '\.html$',
]
