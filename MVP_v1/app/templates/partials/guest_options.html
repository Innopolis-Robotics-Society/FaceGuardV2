{# Returned by /register/options/temporary — adds the expiration picker.
   The datetime-local input gives a native calendar picker with
   hours + minutes precision. The browser submits a naive string
   (no timezone); the backend treats it as local time and converts
   to UTC before storing. #}
<label>
  Valid until
  <input type="datetime-local" name="expires_at"
         value="{{ default_expires }}"
         required>
  <small class="muted">Local time. Calendar picker with HH:MM precision.</small>
</label>
