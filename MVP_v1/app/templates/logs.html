{% extends "base.html" %}
{% block title %}Logs — FaceGuard{% endblock %}

{% block content %}
<div class="page-fill">
  {# ---------- Filter card ---------- #}
  <div class="card" style="flex-shrink:0;">
    <form method="get" action="/logs" id="logs-filter-form">
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" name="q" value="{{ query }}"
               placeholder="Search by name / user..."
               autocomplete="off">
      </div>

      <div class="filter-bar" style="margin-top:12px;">
        <button type="button" class="filter-pill {% if range == 'today' %}active{% endif %}"
                data-range="today">Today</button>
        <button type="button" class="filter-pill {% if range == 'week' %}active{% endif %}"
                data-range="week">This Week</button>
        <button type="button" class="filter-pill {% if range == 'all' %}active{% endif %}"
                data-range="all">All time</button>
        <input type="hidden" name="range" id="range-input" value="{{ range }}">
        <div class="spacer"></div>
        <div class="actions">
          <a href="/logs" class="button outline">Reset</a>
          <button type="submit" class="button primary">Apply</button>
        </div>
      </div>
    </form>
  </div>

  {# ---------- Logs table (auto-refreshes every 5s via HTMX) ---------- #}
  <div class="table-wrap"
       id="logs-table-wrap"
       hx-get="/logs/table"
       hx-trigger="every 5s"
       hx-vals='{"range": "{{ range }}", "q": "{{ query }}"}'
       hx-swap="innerHTML">
    {% include "partials/logs_table.html" %}
  </div>
</div>

<script>
  // Quick-filter pills update the hidden range input and auto-submit.
  document.querySelectorAll('.filter-pill').forEach(function (pill) {
    pill.addEventListener('click', function () {
      document.querySelectorAll('.filter-pill').forEach(function (p) {
        p.classList.remove('active');
      });
      pill.classList.add('active');
      document.getElementById('range-input').value = pill.dataset.range;
      document.getElementById('logs-filter-form').submit();
    });
  });
</script>
{% endblock %}
