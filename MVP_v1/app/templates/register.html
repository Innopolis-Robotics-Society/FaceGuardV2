{% extends "base.html" %}
{% block title %}Register — FaceGuard{% endblock %}

{% block content %}
<div class="grid grid-2-1">
  <section style="min-height:0; overflow:hidden;">
    <div class="video-wrap">
      <img id="camera-feed" src="/stream" alt="Live camera stream">
    </div>
  </section>

  <aside class="page-fill">
    <h3>New person</h3>
    <form id="register-form"
          hx-post="/register"
          hx-target="#register-result"
          hx-swap="innerHTML"
          hx-disabled-elt="#submit-btn"
          style="display:flex; flex-direction:column; gap:0;">
      <label>
        Full name
        <input type="text" name="name" required
               placeholder="Surname Firstname">
      </label>

      <fieldset>
        <legend>Access</legend>
        <label>
          <input type="radio" name="access_type" value="permanent" checked
                 hx-get="/register/options/permanent" hx-target="#guest-options"
                 hx-swap="innerHTML">
          <span>Permanent</span>
        </label>
        <label>
          <input type="radio" name="access_type" value="temporary"
                 hx-get="/register/options/temporary" hx-target="#guest-options"
                 hx-swap="innerHTML">
          <span>Temporary</span>
        </label>
      </fieldset>

      <div id="guest-options"></div>

      <button id="submit-btn" type="submit">Capture &amp; register</button>
      <small class="muted">{{ frame_count }} frames at ~0.4s intervals.</small>
    </form>

    <div id="register-result"></div>
  </aside>
</div>
{% endblock %}
