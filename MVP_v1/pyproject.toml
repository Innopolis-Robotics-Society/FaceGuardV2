[project]
name = "faceguard-backend"
version = "0.1.0"
description = "FaceGuard backend — FastAPI + SQLite admin and recognition orchestration for the FaceGuardV2 access control system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
