[project]
name = "faceguard-backend"
version = "0.1.0"
description = "FaceGuard backend — FastAPI + SQLite admin and recognition orchestration for the FaceGuardV2 access control system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "numpy==2.2.1",
    "bcrypt==4.2.1",
    "itsdangerous==2.2.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sse-starlette==2.1.3",
    "Pillow==11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "pip-audit",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: Integration tests (TestClient + DB)",
    "qrt: Quality Requirement Test",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
